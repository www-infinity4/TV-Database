name: Production-credit source and D1 safety
on:
  pull_request:
    paths:
      - 'workers/starquest-ledger/**'
      - 'js/starquest-cloud-ledger.js'
      - 'tests/production-attribution.test.cjs'
      - 'tests/media-star-creator-two-ledgers.test.cjs'
      - 'tests/media-star-usage-privacy.test.cjs'
      - '.github/workflows/production-attribution.yml'
  push:
    branches: [main]
    paths:
      - 'workers/starquest-ledger/**'
      - 'js/starquest-cloud-ledger.js'
      - 'tests/production-attribution.test.cjs'
      - 'tests/media-star-creator-two-ledgers.test.cjs'
      - 'tests/media-star-usage-privacy.test.cjs'
      - '.github/workflows/production-attribution.yml'
permissions:
  contents: read
jobs:
  ledger-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile StarQuest Worker type safety
        working-directory: workers/starquest-ledger
        run: |
          npm ci
          npx wrangler types
          npx tsc --noEmit
      - name: Validate D1 schema and immutable ledger constraints
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(':memory:')
          base=Path('workers/starquest-ledger/migrations/')
          db.executescript((base/'0001_initial.sql').read_text())
          db.executescript((base/'0004_production_ledger.sql').read_text())
          db.executescript((base/'0005_media_star_creator_ledgers.sql').read_text())
          db.executescript((base/'0006_media_star_usage_receipts.sql').read_text())
          now=1792100000
          db.execute("INSERT INTO accounts VALUES('a','viewer','secret',0,0,0,?,?)",(now,now))
          db.execute("INSERT INTO production_catalog(content_id,platform,source_id,title,created_at,updated_at) VALUES('youtube:abc123ABCDE','youtube','abc123ABCDE','Sample',?,?)",(now,now))
          db.execute("INSERT INTO production_play_receipts VALUES('r','youtube:abc123ABCDE','a','2026-10-15','self_reported_play',31,?)",(now,))
          try:
              db.execute("INSERT INTO production_play_receipts VALUES('r2','youtube:abc123ABCDE','a','2026-10-15','self_reported_play',31,?)",(now,))
              raise AssertionError('Duplicate play was accepted')
          except sqlite3.IntegrityError:pass
          db.execute("INSERT INTO media_star_infinity_view_awards(receipt_id,content_id,created_at) VALUES('r','youtube:abc123ABCDE',?)",(now,))
          try:
              db.execute("INSERT INTO media_star_infinity_view_awards(receipt_id,content_id,created_at) VALUES('r','youtube:abc123ABCDE',?)",(now,))
              raise AssertionError('Duplicate Infinity award was accepted')
          except sqlite3.IntegrityError:pass
          assert db.execute("SELECT proposed_star_coins,settled_star_coins FROM media_star_infinity_view_awards").fetchone()==(1,0)
          db.execute("INSERT INTO media_star_usage_events(receipt_id,content_id,viewer_mask,request_id,event_type,observed_day,recorded_at) VALUES('u1','youtube:abc123ABCDE','anon_testmaskedviewer01234567890','saferequest0123456789','card_open','2026-11-07',?)",(now,))
          try:
              db.execute("INSERT INTO media_star_usage_events(receipt_id,content_id,viewer_mask,request_id,event_type,observed_day,recorded_at) VALUES('u2','youtube:abc123ABCDE','anon_testmaskedviewer01234567890','saferequest0123456789','app_use','2026-11-07',?)",(now,))
              raise AssertionError('Duplicate usage was accepted')
          except sqlite3.IntegrityError:pass
          assert db.execute('SELECT observation_state,reward_state,settled_milli_starcoins FROM media_star_usage_events').fetchone()==('client_unverified','not_payable',0)
          assert db.execute("SELECT star_coins FROM accounts WHERE id='a'").fetchone()[0]==0
          print('Unique receipts, public credits and unfunded wallet isolation validated')
          PY
      - name: Browser source receipts regression tests
        run: |
          node --check js/starquest-cloud-ledger.js
          node --test tests/production-attribution.test.cjs tests/media-star-creator-two-ledgers.test.cjs tests/media-star-usage-privacy.test.cjs
