name: Validate Rogers GPT gateway

on:
  push:
    paths:
      - services/rogers-consensus/worker/index.js
      - tests/rogers-consensus-contract.test.mjs
      - .github/workflows/validate-rogers-gateway.yml
  pull_request:
    paths:
      - services/rogers-consensus/worker/index.js
      - tests/rogers-consensus-contract.test.mjs
      - .github/workflows/validate-rogers-gateway.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check worker syntax
        run: node --check services/rogers-consensus/worker/index.js
      - name: Run gateway contract tests
        run: node --test tests/rogers-consensus-contract.test.mjs
