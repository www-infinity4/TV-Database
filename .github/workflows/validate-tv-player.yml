name: Validate StarQuest YouTube player

on:
  pull_request:
    paths:
      - index.html
      - js/app.js
      - js/data.js
      - js/youtube-only-catalog.js
      - js/avatar-coin.js
      - js/opening-rotation.js
      - js/share-safety-net.js
      - js/auth.js
      - css/style.css
      - tests/**
      - .github/workflows/validate-tv-player.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and behavior
        run: |
          node --check js/data.js
          node --check js/youtube-only-catalog.js
          node --check js/app.js
          node --check js/avatar-coin.js
          node --check js/opening-rotation.js
          node --check js/share-safety-net.js
          node tests/share-flow.test.js
          node tests/share-safety-net.test.js
          node tests/playback-catalog.test.js
          node tests/opening-rotation.test.js
      - name: Check menu-only controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path("index.html").read_text(encoding="utf-8")
          app = Path("js/app.js").read_text(encoding="utf-8")
          avatar = Path("js/avatar-coin.js").read_text(encoding="utf-8")

          aside_start = index.index('id="sidebar"')
          aside_end = index.index("</aside>", aside_start)
          share = index.index('id="player-share-btn"')
          coin = index.index('id="home-starcoin-status"')

          checks = {
              "YouTube gate loads before the ledger": index.index("youtube-only-catalog.js") < index.index("catalog-ledger.js"),
              "Archive runtime is not loaded": "archive-resolver.js" not in index and "source-search.js" not in index,
              "No Archive link remains": "archive.org" not in index.lower(),
              "Share lives in hamburger": aside_start < share < aside_end,
              "StarCoin status lives in hamburger": aside_start < coin < aside_end,
              "Player exposes hamburger": 'id="player-hamburger-btn"' in index,
              "Only one static Avatar Star": index.count("design-star") == 1,
              "Single star is beside the brand": 'data-design-key="brand-name"' in index,
              "Dynamic Avatar stars are disabled": "new MutationObserver" not in avatar,
              "App removes card adjustment markers": "if (marker) marker.remove();" in app,
              "Share still earns tenths": "Every completed share adds 1/10" in index,
              "Daily change time is visible": "12:00 AM in your local time" in index,
          }

          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(("PASS" if passed else "FAIL") + ": " + name)
          if failed:
              raise SystemExit("Validation failed: " + ", ".join(failed))
          PY
