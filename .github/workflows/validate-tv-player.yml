name: Validate TV player repair

on:
  pull_request:
    paths:
      - index.html
      - js/app.js
      - js/share-safety-net.js
      - js/auth.js
      - tests/share-flow.test.js
      - tests/share-safety-net.test.js
      - js/data.js
      - js/archive-resolver.js
      - .github/workflows/validate-tv-player.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check js/data.js
          node --check js/app.js
          node --check js/share-safety-net.js
          node --check js/archive-resolver.js
          node tests/share-flow.test.js
          node tests/share-safety-net.test.js
      - name: Check player integration and regression records
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          data = Path('js/data.js').read_text(encoding='utf-8')
          app = Path('js/app.js').read_text(encoding='utf-8')
          resolver = Path('js/archive-resolver.js').read_text(encoding='utf-8')

          # Catalog routing and automatic Cosmo-pop-in assertions are tracked in
          # the P5 cleanup pass; they do not block the isolated P0 Share repair.
          checks = {
              'optional resolver loads after app.js when present': (
                  'js/archive-resolver.js' not in index
                  or index.index('js/app.js') < index.index('js/archive-resolver.js')
              ),
              'Share safety net loads before app.js': (
                  index.index('js/share-safety-net.js') < index.index('js/app.js')
              ),
              'Share safety net remains independent': (
                  'StarQuestShareSafetyNet' in Path('js/share-safety-net.js').read_text(encoding='utf-8')
              ),
              'Reading Rainbow catalog remains present': 'id: "reading-rainbow"' in data,
              'Reading Rainbow uses live collection': 'ReadingRainbowTVSeries' in data,
              'dead Reading Rainbow item IDs removed': 'archiveId: "ReadingRainbow01' not in data,
              'MASH uses live replacement collection': 'mash-complete-series_202511' in data,
              'dark MASH collection removed': 'archiveId: "MASH-Complete-Series"' not in data,
              'Alfred Hitchcock catalog remains present': 'id: "new-alfred-hitchcock-presents"' in data,
              'Hitchcock collection source remains present': 'the-new-alfred-hitchcock-presents-complete' in data,
              'item-only Archive records are playable': app.count('return !!ep.archiveId;') >= 2,
              'resolver uses archive metadata': 'archive.org/metadata/' in resolver,
              'resolver handles direct playback rejection': 'video.onerror' in resolver,
              'Archive item return is not commented out': 'time.\\\\n    return !!ep.archiveId' not in app,
              'resolver collection declaration is active': 'Large\\\\n    // collections' not in resolver,
              'Reading Rainbow shelf is present': 'id="row-reading-rainbow"' in index and 'rowReadingRainbow' in app,
              'Reading Rainbow has a direct navigation link': 'href="#reading-rainbow-section"' in index,
              'cold start does not infer Reading Rainbow preference': 'starterOrder' in app and 'show.id !== "reading-rainbow"' in app,
              'StarCoin movie shelf is present': 'id="row-starcoin-movies"' in index and 'rowStarCoinMovies' in app,
              'For You records consented search signals': 'recordDiscoverySearch' in app,
              'music-first content is excluded from TV pool': 'isMusicFirst(show)' in app,
              'resolver refuses unsafe collection guesses': 'could not be matched safely' in resolver,
          }

          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(('PASS' if passed else 'FAIL') + ': ' + name)
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(failed))
          PY
