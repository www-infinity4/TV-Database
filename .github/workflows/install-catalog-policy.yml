name: Install catalog access policy

on:
  push:
    branches:
      - agent/tv-player-repair
    paths:
      - js/catalog-policy.js
      - .github/workflows/install-catalog-policy.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tv-player-repair

      - name: Insert policy before application startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          tag = '  <script src="js/catalog-policy.js?v=20260804"></script>\n'
          anchor = '  <script src="js/auth.js?v=20260804"></script>\n'
          if tag not in text:
              if anchor not in text:
                  raise SystemExit('auth.js script anchor not found')
              text = text.replace(anchor, tag + anchor, 1)
              path.write_text(text)
          PY

      - name: Commit generated index update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load catalog policy before app startup"
          git push origin HEAD:agent/tv-player-repair
