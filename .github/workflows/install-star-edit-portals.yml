name: Install Star edit portals

on:
  push:
    branches:
      - agent/user-worlds-cosmo
    paths:
      - js/star-edit-portals.js
      - .github/workflows/install-star-edit-portals.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/user-worlds-cosmo

      - name: Install portal script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          anchor = '  <script src="js/user-worlds.js?v=20260804"></script>\n'
          tag = '  <script src="js/star-edit-portals.js?v=20260804"></script>\n'
          if tag not in text:
              if anchor not in text:
                  raise SystemExit("user-worlds script tag not found")
              path.write_text(text.replace(anchor, anchor + tag, 1), encoding="utf-8")
          PY

      - name: Validate portal script
        run: |
          node --check js/star-edit-portals.js
          python3 - <<'PY'
          from pathlib import Path
          portal = Path("js/star-edit-portals.js").read_text(encoding="utf-8")
          html = Path("index.html").read_text(encoding="utf-8")
          assert html.index("js/user-worlds.js") < html.index("js/star-edit-portals.js")
          assert "star-edit-trigger" in portal
          assert "starquest_world_versions_v1" in portal
          assert "restoreVersion" in portal
          assert "companionName" in portal
          assert ".innerHTML = data" not in portal
          print("PASS: Star edit portal installation")
          PY

      - name: Commit installation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Infinity Builder Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Load universal Star edit portals"
          git push origin HEAD:agent/user-worlds-cosmo
