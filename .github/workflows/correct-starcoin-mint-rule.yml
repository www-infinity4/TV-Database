name: Correct StarCoin mint rule

on:
  push:
    branches: [agent/tv-player-repair]
    paths: [.github/workflows/correct-starcoin-mint-rule.yml]

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tv-player-repair

      - name: Enforce full-watch tenth-share minting
        run: |
          cat > /tmp/correct_starcoin.py <<'PY'
          from pathlib import Path

          auth_path = Path("js/auth.js")
          auth = auth_path.read_text(encoding="utf-8")

          anchor = "        if (!user.shareCooldownByContent || typeof user.shareCooldownByContent !== \"object\") {\n          user.shareCooldownByContent = {};\n        }\n"
          guard_lines = [
              "        const episodeKey = id.includes(\"|\") ? id.split(\"|\").pop() : id;",
              "        const completedHistory = Array.isArray(user.watchHistory)",
              "          ? user.watchHistory.find((item) => {",
              "              if (!item || !item.completed) return false;",
              "              const historyId = String(item.episodeId || \"\");",
              "              return historyId === episodeKey || historyId.endsWith(\"|\" + episodeKey);",
              "            })",
              "          : null;",
              "        if (!completedHistory) {",
              "          return { ok: false, error: \"share_requires_full_watch\", message: \"Watch this video in full before its share can count toward a StarCoin.\" };",
              "        }",
              "        if (!opts.verified) {",
              "          return { ok: false, error: \"share_not_verified\", message: \"The share must be completed before it can count toward a StarCoin.\" };",
              "        }",
              "",
              "        if (!user.shareCooldownByContent || typeof user.shareCooldownByContent !== \"object\") {",
              "          user.shareCooldownByContent = {};",
              "        }",
              "",
          ]
          guard = "\n".join(guard_lines)
          if "share_requires_full_watch" not in auth:
              if anchor not in auth:
                  raise SystemExit("recordShare insertion point not found")
              auth = auth.replace(anchor, guard, 1)

          auth = auth.replace("Share reward (prototype): 10 shares", "StarCoin minted: 10 verified shares of fully watched videos")
          auth = auth.replace('"share reward"', '"verified full-watch share mint"')

          start = auth.find("        const availableRewardSeconds = Math.max(0, user.eligibleWatchSeconds - user.rewardedWatchSeconds);")
          end_marker = "          awardedEvents.push(event);\n        }\n"
          if start >= 0:
              end = auth.find(end_marker, start)
              if end < 0:
                  raise SystemExit("watch reward block end not found")
              end += len(end_marker)
              replacement = "        // Watching establishes eligibility; it does not mint StarCoins by itself.\n        // A StarCoin is minted only on each tenth verified share of a fully watched video.\n        const rewardCount = 0;\n        const awardedEvents = [];\n"
              auth = auth[:start] + replacement + auth[end:]

          auth_path.write_text(auth, encoding="utf-8")

          ai_path = Path("js/ai.js")
          ai = ai_path.read_text(encoding="utf-8")
          ai = ai.replace(
              "You earn ⭐ StarCoins by watching (1 coin per hour) and sharing shows (1 coin per 10 shares). Your coins will unlock Pay-Per-View premium content coming soon!",
              "A StarCoin is minted on the 10th verified share of a video you watched in full. Watching makes that video eligible; watching alone does not mint a coin, and incomplete or unverified shares do not count."
          )
          ai = ai.replace(
              "StarCoins ⭐ are your reward for being a loyal Star! They'll be used for Pay-Per-View access to premium new content — think HBO-quality originals — coming to StarQuest. Collect them now!",
              "StarCoins ⭐ record verified participation in StarQuest. Each coin is minted only when ten eligible shares have been completed from videos watched in full."
          )
          ai_path.write_text(ai, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = index.replace("📺 +1 coin / hour watched", "📺 Full watch makes a video share-eligible")
          index = index.replace("🔗 +1 coin / 10 successful shares (prototype)", "🔗 1 StarCoin / 10 verified eligible shares")
          index = index.replace("Eligible watch-time toward next StarCoin", "Full-watch eligibility progress")
          index_path.write_text(index, encoding="utf-8")
          PY
          python3 /tmp/correct_starcoin.py

      - name: Validate corrected rule
        run: |
          node --check js/auth.js
          node --check js/ai.js
          grep -q 'share_requires_full_watch' js/auth.js
          grep -q 'share_not_verified' js/auth.js
          grep -q 'const rewardCount = 0;' js/auth.js
          grep -q '10 verified shares of fully watched videos' js/auth.js
          grep -q '10th verified share of a video you watched in full' js/ai.js
          ! grep -q '+1 coin / hour watched' index.html

      - name: Commit corrected StarCoin rule
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Infinity Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/auth.js js/ai.js index.html
          git commit -m "Correct StarCoin minting rule"
          git push origin HEAD:agent/tv-player-repair
